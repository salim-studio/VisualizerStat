<script>
let data = [];
let headers = [];
let currentChart = null;
let selectedVariable1 = 0;
let selectedVariable2 = 0;

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const loading = document.getElementById('loading');
  loading.style.display = 'block';
  
  const reader = new FileReader();
  
  // Handle both CSV and Excel files
  if (file.name.endsWith('.csv')) {
    reader.onload = function(e) {
      const text = new TextDecoder('utf-8').decode(new Uint8Array(e.target.result));
      const lines = text.split('\n');
      headers = lines[0].split(',').map(h => h.trim());
      
      data = lines.slice(1)
        .map(line => line.split(','))
        .filter(row => row.length > 1)
        .map(row => row.map(val => parseFloat(val)))
        .filter(row => row.every(val => !isNaN(val)));
        
      updateVariablesList();
      updateChart();
      updateStatistics();
      loading.style.display = 'none';
    };
    reader.readAsArrayBuffer(file);
  } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
    reader.onload = function(e) {
      const workbook = XLSX.read(e.target.result, {type: 'array'});
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      const excelData = XLSX.utils.sheet_to_json(worksheet, {
        header: 1,
        raw: false,
        defval: '',
      });
      
      headers = excelData[0];
      data = excelData.slice(1)
        .map(row => row.map(val => parseFloat(val)))
        .filter(row => row.every(val => !isNaN(val)));
      
      updateVariablesList();
      updateChart();
      updateStatistics();
      loading.style.display = 'none';
    };
    reader.readAsArrayBuffer(file);
  }
}

function updateVariablesList() {
  const variable1Select = document.getElementById('variable1');
  const variable2Select = document.getElementById('variable2');
  
  // Clear existing options
  variable1Select.innerHTML = '<option value="">اختر المتغير الأول</option>';
  variable2Select.innerHTML = '<option value="">اختر المتغير الثاني</option>';
  
  // Add options for each header
  headers.forEach((header, index) => {
    const option1 = document.createElement('option');
    option1.value = index;
    option1.textContent = header;
    variable1Select.appendChild(option1);
    
    const option2 = document.createElement('option');
    option2.value = index;
    option2.textContent = header;
    variable2Select.appendChild(option2);
  });
  
  // Add event listeners
  variable1Select.addEventListener('change', (e) => {
    selectedVariable1 = parseInt(e.target.value);
    updateChart();
    updateStatistics();
  });
  
  variable2Select.addEventListener('change', (e) => {
    selectedVariable2 = parseInt(e.target.value);
    updateChart();
    updateStatistics();
  });
}

function parseCSV(text) {
  return text.split('\n')
    .map(line => line.split(','))
    .filter(row => row.length > 1)
    .map(row => row.map(val => parseFloat(val)))
    .filter(row => row.every(val => !isNaN(val)));
}

function calculateSkewness(values) {
  const n = values.length;
  const mean = math.mean(values);
  const std = math.std(values);
  
  if (std === 0) return 0;
  
  const sum = values.reduce((acc, val) => {
    return acc + Math.pow((val - mean) / std, 3);
  }, 0);
  
  return (n / ((n - 1) * (n - 2))) * sum;
}

  const values1 = data.map(row => row[selectedVariable1]);
  const values2 = data.map(row => row[selectedVariable2]);

  const statsTable = document.createElement('table');

    <th style="padding: 10px; border: 1px solid #ddd; background-color: #f5f5f5; text-align: center;">الانحراف المعياري</th>

  row1.innerHTML = `

    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.min(values1).toFixed(2)}</td>

  `;

  // Add row for second variable
  const row2 = document.createElement('tr');
  row2.innerHTML = `
    <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold; text-align: right;">${headers[selectedVariable2] || 'المتغير الثاني'}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.mean(values2).toFixed(2)}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.median(values2).toFixed(2)}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.std(values2).toFixed(2)}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.variance(values2).toFixed(2)}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${calculateSkewness(values2).toFixed(2)}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.min(values2).toFixed(2)}</td>
    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${math.max(values2).toFixed(2)}</td>
  `;

  tbody.appendChild(row1);
  tbody.appendChild(row2);
  statsTable.appendChild(tbody);

  // Add hover effect styles
  const style = document.createElement('style');
  style.textContent = `
    .statistics-table tr:hover {
      background-color: #f8f9fa;
    }
    .statistics-table td, .statistics-table th {
      transition: background-color 0.2s;
    }
  `;
  document.head.appendChild(style);
  statsTable.className = 'statistics-table';

  // Clear previous content and append new table
  const statisticsDiv = document.getElementById('statistics');
  statisticsDiv.innerHTML = '';
  statisticsDiv.appendChild(statsTable);
}

function calculateLogit(x) {
  return 1 / (1 + Math.exp(-x));
}

function calculateProbit(x) {
  return 0.5 * (1 + math.erf(x / Math.sqrt(2)));
}

function calculateKMeansClusters(data, k) {
  // Initialize centroids randomly
  let centroids = data.slice(0, k);
  let labels = new Array(data.length).fill(0);
  let oldLabels = null;
  let iterations = 0;
  const maxIterations = 100;

  while (iterations < maxIterations) {
    // Assign points to nearest centroid
    oldLabels = [...labels];
    for (let i = 0; i < data.length; i++) {
      let minDist = Infinity;
      for (let j = 0; j < k; j++) {
        const dist = euclideanDistance(data[i], centroids[j]);
        if (dist < minDist) {
          minDist = dist;
          labels[i] = j;
        }
      }
    }

    // Check convergence
    if (arraysEqual(labels, oldLabels)) break;

    // Update centroids
    const newCentroids = Array(k).fill().map(() => Array(data[0].length).fill(0));
    const counts = Array(k).fill(0);
    
    for (let i = 0; i < data.length; i++) {
      const cluster = labels[i];
      counts[cluster]++;
      for (let j = 0; j < data[i].length; j++) {
        newCentroids[cluster][j] += data[i][j];
      }
    }

    for (let i = 0; i < k; i++) {
      if (counts[i] > 0) {
        centroids[i] = newCentroids[i].map(sum => sum / counts[i]);
      }
    }

    iterations++;
  }

  return { labels, centroids };
}

function euclideanDistance(point1, point2) {
  return Math.sqrt(point1.reduce((sum, val, i) => sum + Math.pow(val - point2[i], 2), 0));
}

function arraysEqual(arr1, arr2) {
  if (!arr1 || !arr2) return false;
  return arr1.every((val, i) => val === arr2[i]);
}

function updateChart() {
  const chartType = document.getElementById('chartType').value;
  let traces = [];
  const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();

  // Define layout at the beginning of the function
  let layout = {
    margin: { t: 50, r: 30, b: 40, l: 50 },
    showlegend: true,
    font: { 
      family: 'Cairo',
      size: 12
    },
    direction: 'rtl',
    title: {
      text: `${headers[selectedVariable1]} vs ${headers[selectedVariable2]}`,
      font: { 
        family: 'Cairo',
        size: 16,
        weight: 'bold'
      }
    },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    xaxis: {
      gridcolor: '#eee',
      zerolinecolor: '#ddd'
    },
    yaxis: {
      gridcolor: '#eee',
      zerolinecolor: '#ddd'
    }
  };

  if (data.length === 0) return;

  const values1 = data.map(row => row[selectedVariable1]);
  const values2 = data.map(row => row[selectedVariable2]);

  switch(chartType) {
    case 'scatter':
      traces = [{
        type: 'scatter',
        mode: 'markers',
        x: values1,
        y: values2,
        marker: { 
          color: primaryColor,
          size: 8,
          opacity: 0.7
        },
        name: `${headers[selectedVariable1]} vs ${headers[selectedVariable2]}`
      }];
      break;
    
    case 'histogram':
      traces = [
        {
          type: 'histogram',
          x: values1,
          name: headers[selectedVariable1],
          opacity: 0.7,
          marker: { color: primaryColor }
        },
        {
          type: 'histogram',
          x: values2,
          name: headers[selectedVariable2],
          opacity: 0.7,
          marker: { color: '#ff4081' }
        }
      ];
      break;
    
    case 'box':
      traces = [
        {
          type: 'box',
          y: values1,
          name: headers[selectedVariable1],
          boxpoints: 'outliers',
          marker: { color: primaryColor }
        },
        {
          type: 'box',
          y: values2,
          name: headers[selectedVariable2],
          boxpoints: 'outliers',
          marker: { color: '#ff4081' }
        }
      ];
      break;

    case 'normal':
      const mean1 = math.mean(values1);
      const std1 = math.std(values1);
      const x1 = Array.from({length: 100}, (_, i) => 
        mean1 - 3*std1 + (6*std1 * i/99)
      );
      const y1 = x1.map(xi => 
        Math.exp(-0.5 * Math.pow((xi - mean1)/std1, 2)) / 
        (std1 * Math.sqrt(2 * Math.PI))
      );
      
      traces = [{
        type: 'scatter',
        mode: 'lines',
        x: x1,
        y: y1,
        name: headers[selectedVariable1],
        line: { color: primaryColor }
      }];
      
      layout.title = 'التوزيع الطبيعي';
      break;

    case 'line':
      traces = [
        {
          type: 'scatter',
          mode: 'lines+markers',
          x: values1,
          y: values2,
          name: `${headers[selectedVariable1]} vs ${headers[selectedVariable2]}`,
          line: { color: primaryColor }
        }
      ];
      layout.title = 'المخطط الخطي';
      break;

    case 'bar':
      traces = [
        {
          type: 'bar',
          x: values1,
          y: values2,
          name: `${headers[selectedVariable1]} vs ${headers[selectedVariable2]}`,
          marker: { color: primaryColor }
        }
      ];
      layout.title = 'المخطط العمودي';
      break;

    case 'pie':
      traces = [
        {
          type: 'pie',
          labels: values1.map((_, i) => `${headers[selectedVariable1]}_${i}`),
          values: values1,
          textinfo: "label+percent",
          insidetextorientation: "radial",
          marker: {
            colors: values1.map((_, i) => 
              `hsl(${(i * 360/values1.length)}, 70%, 50%)`
            )
          }
        }
      ];
      layout.title = 'المخطط الدائري';
      break;

    case 'density':
      const kde1 = calculateKDE(values1);
      const kde2 = calculateKDE(values2);
      
      traces = [
        {
          type: 'scatter',
          mode: 'lines',
          x: kde1.x,
          y: kde1.y,
          name: headers[selectedVariable1],
          fill: 'tozeroy',
          line: { color: primaryColor }
        },
        {
          type: 'scatter',
          mode: 'lines',
          x: kde2.x,
          y: kde2.y,
          name: headers[selectedVariable2],
          fill: 'tozeroy',
          line: { color: '#ff4081' }
        }
      ];
      
      layout.title = 'منحنى الكثافة';
      break;

    case 'correlation':
      const corrData = calculateAdvancedCorrelogram();
      traces = [{
        type: 'heatmap',
        z: corrData.correlations,
        x: headers,
        y: headers,
        colorscale: [
          [0.0, '#c41e3a'],
          [0.5, '#ffffff'],
          [1.0, '#1e77c4']
        ],
        zmin: -1,
        zmax: 1,
        text: corrData.correlations.map(row => 
          row.map(val => val.toFixed(3))
        ),
        texttemplate: '%{text}',
        textfont: {
          family: 'Cairo',
          size: 12,
          color: 'black'
        },
        showscale: true,
        hoverongaps: false
      }];

      layout = {
        title: {
          text: 'رسوم الارتباط المتقدم',
          font: {
            family: 'Cairo',
            size: 16
          }
        },
        width: Math.min(800, window.innerWidth - 100),
        height: Math.min(800, window.innerWidth - 100),
        margin: {
          l: 80,
          r: 80,
          t: 100,
          b: 80
        },
        xaxis: {
          tickangle: 45,
          side: 'bottom',
          tickfont: {
            family: 'Cairo',
            size: 10
          }
        },
        yaxis: {
          tickfont: {
            family: 'Cairo',
            size: 10
          }
        },
        annotations: corrData.annotations
      };
      break;

    case 'exponential':
      const lambda = 1; // Rate parameter
      const xExp = Array.from({length: 200}, (_, i) => i * 0.05);
      const yExp = xExp.map(x => calculateExponentialDistribution(x, lambda));
      
      traces = [{
        type: 'scatter',
        mode: 'lines',

// Helper function for calculating quantiles
function calculateQuantile(data, p) {
  const sorted = [...data].sort((a, b) => a - b);
  const n = sorted.length;
  const index = p * (n - 1);
  const lower = Math.floor(index);
  const upper = Math.ceil(index);
  const weight = index - lower;
  
  if (upper >= n) return sorted[n - 1];
  if (lower < 0) return sorted[0];
  
  return sorted[lower] * (1 - weight) + sorted[upper] * weight;
}

// Add the helper function for inverse error function (erfinv)
function erfinv(x) {
  const a = 0.147;
  let y;
  
  if (Math.abs(x) <= 0.7) {
    const z = x * x;
    y = x * (((4.47033 * z + 2.12101) * z + 2.45133) * z + 1.28279) /
        ((((1.13297 * z + 1.35652) * z + 0.17954) * z + 1) * z + 0.84299);
  } else {
    const z = Math.sqrt(-Math.log((1 - Math.abs(x)) / 2));
    y = ((((-0.0012624911 * z + 0.00837487) * z - 0.0768874) * z + 0.207532) * z + 2.4187) /
        ((((0.00943887 * z + 0.0830767) * z + 0.667701) * z + 1) * z + 0.337051);
    if (x < 0) y = -y;
  }
  
  return y;
}

// Update the calculateQQPlot function to use our erfinv implementation
function calculateQQPlot(data) {
  const n = data.length;
  const sorted = [...data].sort((a, b) => a - b);
  
  // Calculate theoretical quantiles
  const theoretical = Array.from({length: n}, (_, i) => {
    const p = (i + 0.5) / n;
    return Math.sqrt(2) * erfinv(2 * p - 1);
  });
  
  // Standardize observed data
  const mean = math.mean(sorted);
  const std = math.std(sorted);
  const observed = sorted.map(x => (x - mean) / std);
  
  return { observed, theoretical };
}

function calculateKDE(data) {
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min;
  const bandwidth = 0.9 * Math.min(
    math.std(data),
    (calculateQuantile(data, 0.75) - calculateQuantile(data, 0.25)) / 1.34
  ) * Math.pow(data.length, -0.2);
  
  const x = Array.from({length: 100}, (_, i) => 
    min + (range * i / 99)
  );
  
  const y = x.map(xi => {
    return data.reduce((sum, di) => {
      return sum + Math.exp(-0.5 * Math.pow((xi - di) / bandwidth, 2)) / 
             (bandwidth * Math.sqrt(2 * Math.PI));
    }, 0) / data.length;
  });

  return { x, y };
}

function calculateCorrelationMatrix() {
  const matrix = [];
  for (let i = 0; i < headers.length; i++) {
    matrix[i] = [];
    for (let j = 0; j < headers.length; j++) {
      const x = data.map(row => row[i]);
      const y = data.map(row => row[j]);
      matrix[i][j] = calculateCorrelation(x, y);
    }
  }
  return matrix;
}

function calculateCorrelation(x, y) {
  const n = x.length;
  const xMean = math.mean(x);
  const yMean = math.mean(y);
  
  const numerator = x.reduce((sum, xi, i) => 
    sum + (xi - xMean) * (y[i] - yMean), 0
  );
  
  const xStd = math.std(x);
  const yStd = math.std(y);
  
  return numerator / ((n - 1) * xStd * yStd);
}

function calculateRegression(y) {
  const x = Array.from({length: y.length}, (_, i) => i + 1);
  const xMean = math.mean(x);
  const yMean = math.mean(y);
  
  const numerator = x.reduce((sum, xi, i) => 
    sum + (xi - xMean) * (y[i] - yMean), 0
  );
  const denominator = x.reduce((sum, xi) => 
    sum + Math.pow(xi - xMean, 2), 0
  );
  
  const slope = numerator / denominator;
  const intercept = yMean - slope * xMean;
  
  return { slope, intercept };
}

function calculateMovingAverage(data, window) {
  const result = [];
  for (let i = 0; i <= data.length - window; i++) {
    const slice = data.slice(i, i + window);
    result.push(slice.reduce((a, b) => a + b) / window);
  }
  return result;
}

function calculateAdvancedCorrelogram() {
  const correlations = [];
  const annotations = [];
  
  // Calculate correlation matrix
  for (let i = 0; i < headers.length; i++) {
    correlations[i] = [];
    for (let j = 0; j < headers.length; j++) {
      const x = data.map(row => row[i]);
      const y = data.map(row => row[j]);
      const corr = calculateCorrelation(x, y);
      correlations[i][j] = corr;
      
      // Add significance indicators
      const n = data.length;
      const pValue = calculatePValue(corr, n);
      
      let significance = '';
      if (pValue < 0.001) significance = '***';
      else if (pValue < 0.01) significance = '**';
      else if (pValue < 0.05) significance = '*';
      
      annotations.push({
        x: j,
        y: i,
        xref: 'x',
        yref: 'y',
        text: significance,
        showarrow: false,
        font: {
          family: 'Cairo',
          size: 12,
          color: Math.abs(corr) > 0.5 ? 'white' : 'black'
        }
      });
    }
  }
  
  return {
    correlations: correlations,
    annotations: annotations
  };
}

// Add this helper function for p-value calculation
function calculatePValue(correlation, n) {
  const tStat = correlation * Math.sqrt((n-2)/(1-correlation*correlation));
  return 2 * (1 - math.erf(Math.abs(tStat)/Math.sqrt(2)));
}

// New helper functions for PP and QQ plots
function calculatePPPlot(data) {
  const n = data.length;
  const sorted = [...data].sort((a, b) => a - b);
  
  // Calculate empirical probabilities
  const empirical = sorted.map((_, i) => (i + 1) / n);
  
  // Calculate theoretical probabilities using normal distribution
  const mean = math.mean(sorted);
  const std = math.std(sorted);
  const theoretical = sorted.map(x => 
    0.5 * (1 + math.erf((x - mean) / (Math.sqrt(2) * std)))
  );
  
  return { empirical, theoretical };
}

function calculateFDistribution(x, df1, df2) {
  const numerator = Math.pow(df1 * x, df1/2) * Math.pow(df2, df2/2);
  const denominator = Math.pow(df1 * x + df2, (df1 + df2)/2);
  const beta = math.gamma(df1/2) * math.gamma(df2/2) / math.gamma((df1 + df2)/2);
  return numerator / (x * denominator * beta);
}

function calculateTDistribution(x, df) {
  const numerator = math.gamma((df + 1) / 2);
  const denominator = Math.sqrt(df * Math.PI) * math.gamma(df / 2);
  return numerator / denominator * Math.pow(1 + x*x/df, -(df + 1)/2);
}

function calculateChiSquareDistribution(x, df) {
  const numerator = Math.pow(x, df/2 - 1) * Math.exp(-x/2);
  const denominator = Math.pow(2, df/2) * math.gamma(df/2);
  return numerator / denominator;
}

function calculateExponentialDistribution(x, lambda) {
  return lambda * Math.exp(-lambda * x);
}

function calculateARIMA(data, p = 1, d = 1, q = 1) {
  const n = data.length;
  const differenced = [];
  
  // Differencing
  for(let i = d; i < n; i++) {
    let value = data[i];
    for(let j = 1; j <= d; j++) {
      value -= data[i - j];
    }
    differenced.push(value);
  }
  
  // AR component
  const ar = [];
  for(let i = p; i < differenced.length; i++) {
    let pred = 0;
    for(let j = 1; j <= p; j++) {
      pred += 0.7 * differenced[i - j]; // Using simple AR coefficients
    }
    ar.push(pred);
  }
  
  // MA component
  const residuals = differenced.slice(p).map((v, i) => v - ar[i]);
  const ma = [];
  for(let i = q; i < residuals.length; i++) {
    let pred = 0;
    for(let j = 1; j <= q; j++) {
      pred += 0.3 * residuals[i - j]; // Using simple MA coefficients
    }
    ma.push(pred);
  }
  
  // Combine predictions
  const predictions = ar.map((v, i) => v + ma[i]);
  
  // Reverse differencing
  const final = [];
  for(let i = 0; i < predictions.length; i++) {
    let value = predictions[i];
    for(let j = 1; j <= d; j++) {
      value += data[i + d];
    }
    final.push(value);
  }
  
  return final;
}

function calculateSARIMA(data, period = 12) {
  const n = data.length;
  
  // Calculate seasonal component
  const seasonal = [];
  for(let i = 0; i < n; i++) {
    const seasonalPeriod = i % period;
    const seasonalValues = [];
    for(let j = seasonalPeriod; j < n; j += period) {
      seasonalValues.push(data[j]);
    }
    seasonal.push(math.mean(seasonalValues));
  }
  
  // Remove seasonal component
  const deseasonalized = data.map((v, i) => v - seasonal[i]);
  
  // Apply ARIMA to deseasonalized data
  const arimaForecast = calculateARIMA(deseasonalized);
  
  // Add seasonal component back
  return arimaForecast.map((v, i) => v + seasonal[i + 3]);
}

// Add helper function for seasonal pattern
function calculateSeasonalPattern(data, period = 12) {
  const seasonal = [];
  const n = data.length;
  
  for(let i = 0; i < n; i++) {
    const seasonalPeriod = i % period;
    const seasonalValues = [];
    for(let j = seasonalPeriod; j < n; j += period) {
      seasonalValues.push(data[j]);
    }
    seasonal.push(math.mean(seasonalValues));
  }
  
  return seasonal;
}

// Add helper function for symmetry calculations
function calculateSymmetryData(data) {
  // Sort the data
  const sorted = [...data].sort((a, b) => a - b);
  const n = sorted.length;
  const median = n % 2 === 0 
    ? (sorted[n/2 - 1] + sorted[n/2]) / 2 
    : sorted[Math.floor(n/2)];
  
  // Calculate expected symmetric values
  const expected = [];
  const actual = [];
  
  for(let i = 0; i < Math.floor(n/2); i++) {
    const leftValue = sorted[i];
    const rightValue = sorted[n - 1 - i];
    const expectedValue = (leftValue + rightValue) / 2;
    
    expected.push(expectedValue);
    actual.push(median);
  }
  
  // Add center point for odd-length datasets  
  if(n % 2 === 1) {
    expected.push(median);
    actual.push(median);
  }
  
  return {
    expected: expected,
    actual: actual
  };
}
